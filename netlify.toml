[build]
  publish = "."

[build.environment]
  TZ = "America/Chicago"

[context.production]
  publish = "."

# Production is intentionally static. Secrets belong in scoped Netlify
# environment variables or server-side services, never in this file.

# Form-route rate limiting lives in netlify/edge-functions/rate-limit.js.
# Netlify enforces this code-based rule before the static handler.
