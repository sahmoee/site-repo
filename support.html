<h1>Stocked Support</h1>
<p>Email <a href="mailto:support@sowensstudios.com">support@sowensstudios.com</a> or use the form below. If the app gave you a diagnostics reference (STK-…), include it — it lets us see the technical picture without any of your kitchen data.</p>
<form name="support" method="POST" data-netlify="true">
  <p><label>Your email<br><input type="email" name="email" required style="width:100%;padding:8px"></label></p>
  <p><label>Diagnostics reference (optional)<br><input type="text" name="reference" placeholder="STK-XXXXXXXXXX" style="width:100%;padding:8px"></label></p>
  <p><label>What's happening?<br><textarea name="message" rows="6" required style="width:100%;padding:8px"></textarea></label></p>
  <p><button type="submit" style="padding:10px 22px;background:#e8a33d;border:0;border-radius:8px;font-weight:600">Send</button></p>
</form>
<p><a href="/">← sowensstudios.com</a></p>
